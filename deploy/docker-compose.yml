# MZT APPS — single-host stack (MariaDB + Laravel backend + Nitro frontend + Caddy).
#
# Layout on the host ($DEPLOY_DIR, e.g. /opt/mzt):
#   docker-compose.yml   <-- this file (copied from frontend/deploy)
#   Caddyfile            <-- copied from frontend/deploy
#   .env                 <-- copy of .env.example, edit with real values
#   backend/             <-- git clone of Misyad/laravel-mzt
#   frontend/            <-- git clone of Misyad/maziltu-design-studio
#   db/init/             <-- drop the MariaDB dump (mazw9983_alvinade_maziltu.sql) here (first boot only)
#   storage/             <-- mirror of the backend repo's storage/app (media files)
#
# Frontend is built once with VITE_API_BASE_URL baked in; Caddy is the single
# public entrypoint, so /api and /storage stay same-origin (no CORS).
# Public ingress: http://<server-ip>:${PUBLIC_PORT:-3015}

services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${MYSQL_DATABASE:-mazw9983_alvinade_maziltu}
      MARIADB_USER: ${MYSQL_USER:-maziltu}
      MARIADB_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
      MARIADB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - dbdata:/var/lib/mysql
      # Imported ONLY on first boot with an empty volume. Re-import by
      # destroying the volume: docker compose down -v; docker compose up -d.
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
    expose:
      - "3306"

  backend:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:?set APP_KEY in .env}
      APP_URL: ${APP_URL:-http://localhost}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: ${MYSQL_DATABASE:-mazw9983_alvinade_maziltu}
      DB_USERNAME: ${MYSQL_USER:-maziltu}
      DB_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
      CACHE_DRIVER: file
      SESSION_DRIVER: file
      QUEUE_CONNECTION: sync
    volumes:
      # Live media (bar codes, photos). Host dir = mirror of backend storage/app.
      - ./storage:/app/storage/app
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "80"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:?set VITE_API_BASE_URL in .env}
        # SSR fetches reach the host's published port through host.docker.internal.
        SSR_API_BASE_URL: ${SSR_API_BASE_URL:-http://host.docker.internal:${PUBLIC_PORT:-3015}/api}
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PORT: "3000"
    expose:
      - "3000"

  caddy:
    image: caddy:alpine
    restart: unless-stopped
    ports:
      - "${PUBLIC_PORT:-3015}:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - backend
      - frontend

volumes:
  dbdata: